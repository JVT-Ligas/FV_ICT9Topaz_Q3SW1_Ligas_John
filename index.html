<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Currency Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #77dd77;  
            color: white;               
            font-family: sans-serif;
            text-align: center;
        }

        h1, h2 {
            margin-top: 20px;
        }

    </style>
</head>
<body>
    <h1>Converting Currencies</h1>
   
    <script>
        let php = 100;
        document.write("<h2>Convert 100 Pesos </h2>" + "<kbd>" + php + "</kbd>" + "<h2> to the following currencies </h2>");

        function convertCurrency(currency) {
            let php = 100;
            let result;

            if (currency === 'yen') {
                result = php * 2.6861; 
            } else if (currency === 'dollar') {
                result = 0.71;
            }

            document.getElementById('display').innerHTML = '<kbd>' + result.toFixed(2) + '</kbd>';
        }
    
    </script>

    <br>
    
    <p id="display"> </p>

    <br>

    <div class="text-center">
        <button type="button" class="btn btn-warning m-2" onclick="convertCurrency('yen')">Yen</button>
        <button type="button" class="btn btn-info m-2" onclick="convertCurrency('dollar')">Dollar</button>
    </div>

    <br>

    <a href="index.html"><button class="btn btn-success btn-lg">Refresh</button></a>

</body>
</html>
